# ==============================================================================
# SYLLABUS MODULE 4.1 & 6.1: Spring Boot & MySQL Database Configuration
# ==============================================================================

# Application Name & Port
spring.application.name=donation-management
server.port=8080

# Database Connectivity (JDBC connection string to local MySQL server)
# createDatabaseIfNotExist=true creates 'donation_db' automatically on MySQL
spring.datasource.url=jdbc:mysql://localhost:3306/donation_db?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC
spring.datasource.username=root
spring.datasource.password=3456
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# JPA & Hibernate configuration
# ddl-auto=update automatically creates or alters tables based on Entity classes
spring.jpa.hibernate.ddl-auto=update

# Show generated SQL queries in the console for educational transparency
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect
